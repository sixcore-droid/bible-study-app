<script>
/* ===== DATA (in the real build each block is a JSON file the runner already serves) ===== */

/* Plans, passages and versions are data files published beside this page:
   plans/index.json lists the plans, plans/<id>.json holds each plan's days. Text and every panel's data come by
   reference from text/<book>.json and index/<book>.json (see jayms-study.js), so any passage can be opened.
   Changing or adding a plan is a data edit, never a code edit. */
let PLANINDEX=null, PLANS={}, READINGS=[];
/* Versions whose text carries the dotted word links (the [w:key] markers in the text files). */
const LINKED = ["LSB","ESV","NET"];
const VERNAMES = {LSB:"Legacy Standard Bible",NLT:"New Living Translation",ESV:"English Standard Version",NET:"New English Translation",BSB:"Berean Standard Bible",CSB:"Christian Standard Bible",NASB:"New American Standard Bible 2020",MSG:"The Message",LXX:"Brenton Septuagint (Greek OT in English)",KJV:"King James Version"};

/* Everything the side panels show comes from the data files listed in docs/DEVELOPER.md section 3 (text/, index/, study/ ...),
   built by scripts/build-*.py from the tools' own data, jayms.com, the vault and the synced Claude chats. */
/* The side panels are JaymsStudy components (jayms-study.js). The workstation only hosts them:
   which one is open, which passage it follows, and what it hears back (a word, a heading). */
const JST = JaymsStudy;
/* ?live=0 shows only the copy the workstation was built with (for testing that it matches the live data) */
try{ if(new URLSearchParams(location.search).get("live")==="0") JST.config({liveOff:true}) }catch(e){}
/* the reading on screen: one of the day's readings, or a passage opened from the box (S.adhoc) */
const cur = ()=> S.adhoc || READINGS[S.reading];
const pd = ()=>{ const r=cur(); return r ? JST.data.peek(r.ref) : null };
const L = k => (pd()&&pd()[k]) || [];
function loadPanel(ref){ Promise.all([JST.data.passage(ref), JST.data.xref(ref), JST.data.notes(ref), JST.data.live(), S.view==="public"?null:JST.data.shelf()]).then(()=>{ renderDock() }) }
/* James's study Project on claude.ai: "Ask in my Project" copies the question with the passage material and opens it beside the app
   (claude.ai can't be framed or driven from another page, so this is the route to the Project's own answers) */
const STUDY_PROJECT = "https://claude.ai/project/019d9436-1dc6-7487-a80d-088b37cc8581";
const QUICK = [
  "Walk me through this passage verse by verse",
  "What is the ANE background here?",
  "How does this connect to Deuteronomy 32 and John 10?",
  "Quiz me: 5 questions on this passage"
];

/* The dock: an order, plus the one tool that belongs to this page alone (Notes). Everything else is a component's own meta. */
const NOTES_ICON = '<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>';
const DOCK = ["verse","outline","word","|","council","gods","facts","posts","corpus","fathers","targum","xref","bp","x","chats","logos","shelf","vocab","ideas","vault","|","wrap","review","config","notes"];
function toolMeta(id){
  if(id==="notes") return {id, label:"Notes", name:"All my notes", icon:NOTES_ICON};
  const P = JST.panels[id]; return Object.assign({}, P.meta);
}
function toolCount(id){
  if(id==="posts") return dayPosts().length;
  if(id==="x") return cur() && thread(cur().id) ? 1 : 0;
  if(id==="logos") return ST.c("logos").all().filter(x=>!x.done).length;
  if(id==="vocab") return ST.c("vocab").all().length;
  if(id==="ideas") return ST.c("ideas").all().filter(x=>!x.written).length;
  if(id==="review") return JST.reviewCount(ST.c("vocab").all(), k=>ST.c("reviews").peek(k));
  if(id==="notes"||id==="claude"||id==="verse"||id==="outline"||id==="word") return null;
  const r=cur(); return r ? JST.panels[id].count(JST.data.peek(r.ref)) : null;
}
/* the public build on jayms.com (scripts/build-public.py sets window.JAYMS_PUBLIC): readers only, so no Notes button */
const PUBLIC = !!window.JAYMS_PUBLIC;
const TOOLS = DOCK.filter(id=>!(PUBLIC && (id==="notes"||id==="x"))).map(id=>id==="|"?{sep:true}:toolMeta(id));

/* ===== STATE ===== */
/* Saved state moved to canonical reference keys in v024: the three hand ids become their references. */
const MOVED = {ps82:"psalm-82", dt32:"deuteronomy-32-7-9", jn10:"john-10-31-39"};
function migrateLocal(){
  try{
    if(localStorage.getItem("ws.migrated")==="1") return;
    for(const [o,n] of Object.entries(MOVED)){
      for(const p of ["ws.note.","ws.pub.","ws.saved.","ws.draft.","ws.thread.","ws.obs.","jx.draft."]){
        const v=localStorage.getItem(p+o); if(v==null) continue;
        if(localStorage.getItem(p+n)==null) localStorage.setItem(p+n,v); localStorage.removeItem(p+o);
      }
    }
    const done=JSON.parse(localStorage.getItem("ws.done")||"{}"), nd={};
    for(const k in done){ const parts=k.split(":"), last=parts.pop(); nd[[...parts, MOVED[last]||last].join(":")]=done[k]; }
    localStorage.setItem("ws.done",JSON.stringify(nd)); localStorage.setItem("ws.migrated","1");
  }catch(e){}
}
migrateLocal();
async function migrateDB(){
  if(!DB||!OWNER) return;
  for(const [o,n] of Object.entries(MOVED)){
    for(const coll of [UID?"data/users/"+UID:null,"pub","threads"]){ if(!coll) continue;
      try{ const a=await DB.collection(coll).doc(o).get(); if(!a.exists) continue;
        const b=await DB.collection(coll).doc(n).get(); if(!b.exists) await DB.collection(coll).doc(n).set(a.data());
        await DB.collection(coll).doc(o).delete(); }catch(e){}
    }
  }
}
/* v025: everything James saves goes through one store (jayms-store.js). This moves the v024-era keys into it, once. */
function migrateToStore(){
  try{
    if(localStorage.getItem("ws.migrated2")==="1") return;
    const J=k=>{ try{ const v=localStorage.getItem(k); return v==null?null:JSON.parse(v) }catch(e){ return null } };
    const put=(c,id,d)=>localStorage.setItem(`js:${c}:${id}`, JSON.stringify(d));
    const keys=[]; for(let i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));
    keys.filter(k=>k.startsWith("ws.note.")).forEach(k=>{ const id=k.slice(8), t=J("ws.saved."+id)||Date.now();
      put("notes",id,{text:J(k)||"", pub:!!J("ws.pub."+id), obsidian:J("ws.obs."+id)||null, createdAt:t, updatedAt:t});
      if(J("ws.pub."+id) && J(k)) put("pub",id,{text:J(k), createdAt:t, updatedAt:t});
      ["ws.note.","ws.pub.","ws.saved.","ws.obs."].forEach(p=>localStorage.removeItem(p+id)) });
    keys.filter(k=>k.startsWith("ws.draft.")).forEach(k=>{ const d=J(k); if(d) put("drafts",k.slice(9),Object.assign({updatedAt:Date.now()},d)); localStorage.removeItem(k) });
    keys.filter(k=>k.startsWith("ws.thread.")).forEach(k=>{ const t=J(k); if(t&&t.url) put("threads",k.slice(10),Object.assign({updatedAt:t.savedAt||Date.now()},t)); localStorage.removeItem(k) });
    const done=J("ws.done")||{}; Object.keys(done).forEach(id=>{ if(done[id]) put("done",id,{done:true, at:null, updatedAt:Date.now()}) }); localStorage.removeItem("ws.done");
    localStorage.setItem("ws.migrated2","1");
  }catch(e){}
}
migrateToStore();
/* The collections. sync:true = saved to James's account as well as this browser; public:true = readers can read it. */
const ST = JaymsStore.create({ collections: {
  notes:   {sync:true},                  // a note per passage: {text, pub, obsidian}
  drafts:  {sync:false},                 // unsaved note edits, this browser only
  done:    {sync:true},                  // "plan:day:passage" -> {done, at}
  pub:     {sync:true, public:true},     // the public copy of a note readers see: {text}
  threads: {sync:true, public:true},     // the X discussion for a passage: {url, handle, text, savedAt}
  wraps:   {sync:true},
  shelfcfg:{sync:true},
  vocab:   {sync:true},  ideas: {sync:true},  logos: {sync:true},     // ready for the features to come
  plans:   {sync:true},  answers: {sync:true}, reviews: {sync:true}
}});
const store = ST.prefs;                  // per-device settings (layout, widths, version) keep their own keys
let DB=null, UID=null, SAMPLE=null, OWNER=true, LIVE=false;
const NOTES={};                          // the note being edited for each passage, loaded from the store
const thread = id => { const t=ST.c("threads").peek(id); return t&&JaymsX.parse(t.url) ? t : null };
/* the public text of a note: James sees his own saved public notes (also when previewing Read along); readers see the public copy */
const pubText = id => { if(OWNER){ const n=ST.c("notes").peek(id); return n&&n.pub ? n.text||"" : "" } return (ST.c("pub").peek(id)||{}).text||"" };
const isDone = id => !!(ST.c("done").peek(id)||{}).done;
function dayPosts(){const ids=new Set(); (S.adhoc?[S.adhoc]:READINGS).forEach(r=>((JST.data.peek(r.ref)||{}).posts||[]).forEach(p=>ids.add(p.id))); return [...ids]}
/* ===== DISCUSSION ON X =====
   The feature itself is the JaymsX component (x-discuss.js), the same one any jayms.com page can use.
   The workstation only decides the key (the passage), the copy, the link choices and where threads are stored. */
function xStore(){ return JaymsStore.forJaymsX(ST.c("threads")) }
function initNote(id, force){
  if(NOTES[id] && !force) return;
  const n=ST.c("notes").peek(id)||{}; NOTES[id]={text:n.text||"", pub:!!n.pub, savedAt:n.updatedAt||null, obsidian:n.obsidian||null};
  const dr=ST.c("drafts").peek(id); if(dr){ NOTES[id].text=dr.text; NOTES[id].pub=!!dr.pub; DIRTY[id]=true }
}
const S = {view:"me", plan:store.get("plan",null), day:null, reading:0, tool:"council", word:null, addPsalm:store.get("addPsalm",false), skipLists:store.get("skipLists",false),
           size:store.get("size",19), ver:store.get("ver","LSB"), ver2:store.get("ver2","NLT"), par:store.get("par",1), layout:store.get("layout","read")};
/* public build: Read along only; no My desk switch, no prototype badge */
if(PUBLIC){ OWNER=false; S.view="public"; S.tool=null; document.body.classList.add("public-app") }   // visitors arrive with no panel open
/* a refresh brings back the panel that was open (null = none); a first visit keeps the default above */
{ const t=store.get("tool","__unset"); if(t!=="__unset" && (t===null || TOOLS.some(x=>x.id===t && !(x.owner && S.view==="public")))) S.tool=t; }
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== PLAN RAIL ===== */
const plan=()=>PLANS[S.plan];
/* day N of a plan; a weekdays plan (F260) moves on Monday to Friday only, so a weekend stays on Friday's reading for catching up */
/* when a plan starts: James's own start date on his desk; on the public site, the day the visitor first opened that plan (they begin at day 1) */
function planStart(p){ if(!PUBLIC) return p.start; const k="start:"+p.id; let d=store.get(k,null);
  if(!d){ const t=new Date(); d=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; store.set(k,d) } return d }
function todayNum(p){const d0=new Date(planStart(p)+"T00:00:00"), now=new Date(); now.setHours(0,0,0,0);
  if(p.weekly) return now<d0 ? 0 : Math.floor((now-d0)/(7*864e5))+1;   // one entry a week (the F260 memory verses)
  if(!p.weekdays) return Math.floor((now-d0)/864e5)+1;
  if(now<d0) return 0;
  let n=0; for(const d=new Date(d0); d<=now; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w&&w<6) n++ }
  return Math.max(n,1)}
const dk=(r,day)=>`${S.plan}:${day||S.day}:${r.did||r.id}`;   // did: the plan's own reference, before skip lists trimmed it
function dayDone(d){return d.readings.every(x=>isDone(`${S.plan}:${d.day}:${JaymsRef.key(x.ref)}`))}
function buildDay(){
  const p=plan(); const d=p.days.find(x=>x.day===S.day)||p.days[0];
  /* the day's readings, less the chapters James skips (when that box is ticked), plus a psalm (when that one is) */
  let list = d.readings.slice();
  /* skipping trims the skipped chapters out of a reading ("Numbers 32-35" becomes "Numbers 32"), and drops a reading left empty */
  if(S.skipLists && SKIP) list = list.map(x=>{
    const segs=JaymsRef.parse(x.ref), keep=[];
    for(const sg of segs){
      const sk=SKIP[sg.book]||[];
      if(sg.v1!==1 || sg.v2!==999){ if(!sk.includes(sg.c1) || sg.c1!==sg.c2) keep.push(sg); continue }   /* a verse range stays as it is */
      let run=null;
      for(let c=sg.c1;c<=sg.c2;c++){ if(sk.includes(c)){ run=null; continue } if(run && run.c2===c-1) run.c2=c; else { run={book:sg.book,c1:c,v1:1,c2:c,v2:999}; keep.push(run) } }
    }
    return keep.length ? Object.assign({}, x, {ref: JaymsRef.format(keep), orig: x.ref}) : null }).filter(Boolean);
  /* the psalm that goes with the day's chapter (plans/psalm-pairs.json: quotations, cross-references, the Divine Council Index), with the reason */
  if(S.addPsalm && d.readings.length){ const sg=JaymsRef.parse((list[0]||d.readings[0]).ref)[0];
    if(sg && sg.book!=="Psalm"){ const pr=PAIRS && PAIRS[`${sg.book}|${sg.c1}`], ps=`Psalm ${pr ? pr[0] : ((S.day-1)%150)+1}`;
      if(!list.some(x=>JaymsRef.key(x.ref)===JaymsRef.key(ps))) list.push({ref:ps, role:`Psalm for ${sg.book} ${sg.c1}`, why:pr ? pr[1].replace(/^./,c=>c.toUpperCase()) + "." : ""}) } }
  if(!list.length) list = d.readings.map(x=>Object.assign({}, x, {role:"Usually skipped: a list or genealogy"}));
  /* a reading is addressed by its reference: id is the canonical key ("psalm-82"), used by notes, done marks and threads */
  READINGS = list.map(x=>{const id=JaymsRef.key(x.ref); initNote(id); loadPanel(x.ref);
    const o={id, did:JaymsRef.key(x.orig||x.ref), ref:x.ref, role:x.role||"Reading", why:x.why||"", rows:null};
    JST.data.text(x.ref).then(rows=>{ o.rows=rows; if(READINGS.includes(o)) renderReader() });
    return o});
  if(S.reading>=READINGS.length) S.reading=0;
}
function renderPlan(){
  const p = plan(); if(!p) return;

  const id = JaymsRef.key(segs), i = READINGS.findIndex(x=>x.id===id);

/* Find in the text: marks every match in the passage on screen, Enter for the next, Shift+Enter for the previous, Esc to clear.
   Ctrl/Cmd+F goes to the box. It searches the words as shown, so it ignores verse numbers and markup. */
let FIND_I = 0;
function findApply(move){
  const box=$("text"), q=$("findq").value.trim();
  box.querySelectorAll("mark.hit").forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
  box.normalize();
  if(q.length<2){ $("findmsg").textContent=""; return }
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), hits=[];
  const walk=document.createTreeWalker(box, NodeFilter.SHOW_TEXT, {acceptNode:n=>n.parentElement.closest(".sup,.vtag,.lbl,.empty")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n=>{ const t=n.nodeValue; let m, last=0, frag=null; re.lastIndex=0;
    while((m=re.exec(t))){ frag=frag||document.createDocumentFragment(); frag.append(t.slice(last,m.index)); const mk=document.createElement("mark"); mk.className="hit"; mk.textContent=m[0]; frag.append(mk); hits.push(mk); last=m.index+m[0].length }
    if(frag){ frag.append(t.slice(last)); n.replaceWith(frag) } });
  if(!hits.length){ $("findmsg").textContent="none"; return }
  FIND_I = move===false ? Math.min(FIND_I, hits.length-1) : (FIND_I + move + hits.length) % hits.length;
  hits[FIND_I].classList.add("now");
  if(move!==false || document.activeElement===$("findq")) hits[FIND_I].scrollIntoView({block:"center",behavior:"smooth"});
  $("findmsg").textContent=`${FIND_I+1} of ${hits.length}`;
}

$("layoutbtn").onclick=()=>{S.layout=S.layout==="verse"?"read":"verse";store.set("layout",S.layout);renderReader()};
$("parbtn").onclick=()=>{S.par=S.par?0:1;store.set("par",S.par);renderReader()};
$("smaller").onclick=()=>{S.size=Math.max(16,S.size-1);store.set("size",S.size);renderReader()};
/* « » the chapter before or after the one on screen (across books too); it opens like a passage from the Go box */
function stepChapter(d){
  const segs=JaymsRef.parse(cur().ref); if(!segs.length) return null;
  const s=d<0?segs[0]:segs[segs.length-1], books=JaymsRef.books, b=JaymsRef.book(s.book);
  let c=(d<0?s.c1:s.c2)+d, bk=b;
  if(c<1){ bk=books[b.order-1]; if(!bk) return null; c=bk.chapters }
  else if(c>b.chapters){ bk=books[b.order+1]; if(!bk) return null; c=1 }
  return bk.chapters===1 ? bk.name : `${bk.name} ${c}`;
}
function syncChapterNav(){ [["prevch",-1],["nextch",1]].forEach(([id,d])=>{ const t=cur()&&stepChapter(d); $(id).disabled=!t; $(id).title=t?(d<0?"Previous chapter: ":"Next chapter: ")+t:"" }) }
$("prevch").onclick=()=>{ const t=stepChapter(-1); if(t) openPassage(t) };
$("nextch").onclick=()=>{ const t=stepChapter(1); if(t) openPassage(t) };
$("larger").onclick=()=>{S.size=Math.min(26,S.size+1);store.set("size",S.size);renderReader()};
function railShown(){ const r=$("rail"); return getComputedStyle(r).display!=="none" && (getComputedStyle(r).position!=="fixed" || r.classList.contains("open")) }
function syncRailBtn(){ const on=railShown(); $("railbtn").classList.toggle("on",on); $("railbtn").setAttribute("aria-expanded",on) }
$("railbtn").onclick=()=>{
  const r=$("rail");
  if(r.classList.contains("open")){ r.classList.remove("open") }
  else if(getComputedStyle(r).position==="fixed" && getComputedStyle(r).display!=="none"){ r.classList.add("open") }
  else { const hide=!document.body.classList.contains("rail-hidden"); document.body.classList.toggle("rail-hidden",hide); store.set("railHidden",hide);
         if(!hide && getComputedStyle(r).position==="fixed") r.classList.add("open") }
  syncRailBtn();
};
document.body.classList.toggle("rail-hidden",!!store.get("railHidden",false));
window.addEventListener("resize",syncRailBtn);
/* today's date in the top bar, checked every minute so it turns over at midnight */
function showToday(){ $("today").textContent = new Date().toLocaleDateString("en-GB",{weekday:"long", day:"numeric", month:"long", year:"numeric"}).replace(",","") }
showToday(); setInterval(showToday, 60000);
/* Load the plan data, then draw. */
(async()=>{
  try{
    const get=u=>fetch(u).then(x=>{if(!x.ok) throw new Error(u); return x.json()});
    PLANINDEX = await get("plans/index.json");
    const plans = await Promise.all(PLANINDEX.plans.map(x=>get(x.file)));
    plans.forEach(p=>PLANS[p.id]=p); mergeMyPlans();
    choosePlan(PLANS[S.plan] ? S.plan : PLANINDEX.default);
    restoreOpen();
    render();
  }catch(e){
    $("rtitle").textContent="Reading plans didn't load";
    $("rwhy").textContent="The plan files (plans/index.json) couldn't be read. Reload the page to try again.";
  }
})();

/* Light up the live parts when the page is open on claude.ai: who is viewing, saved notes, asking Claude. */
(async()=>{
  if(!window.claude||!claude.use) return;
  const user = await claude.use("user");
  if(user){
    OWNER = await user.isOwner();
    if(!OWNER){S.view="public"; if(TOOLS.find(t=>t.id===S.tool&&t.owner)) S.tool="council"}
    try{UID = await user.id()}catch(e){}
  }
  DB = await claude.use("db");
  if(DB){
    LIVE = true;
    await migrateDB();
    ST.attach(JaymsStore.adapters.artifactDb(DB, UID, ["pub","threads"]), {canWritePublic: OWNER});
    /* notes saved before v025 sit in data/users/<uid>/<passage>: bring them into the notes collection, then retire them */
    if(OWNER&&UID){
      const got = await DB.collection("data/users/"+UID).get().catch(()=>null);
      for(const d of (got?got.docs:[])){
        if(d.id.includes("~")) continue; const v=d.data()||{};
        const mine=ST.c("notes").peek(d.id);
        if(!mine || (v.updatedAt||0) > (mine.updatedAt||0)) await ST.c("notes").save(d.id,{text:String(v.text||""), pub:!!v.pub, obsidian:v.obsidian||null, updatedAt:v.updatedAt||Date.now()});
        try{ await DB.collection("data/users/"+UID).doc(d.id).delete() }catch(e){}
      }
    }
    await ST.syncAll();
    ["notes","pub","threads","done"].forEach(c=>ST.c(c).on(id=>{
      if(c==="notes" && !DIRTY[id]) initNote(id, true);
      renderReader(); renderDock(); renderPlan(); if(S.tool==="notes"||S.tool==="x") renderPanel();
    }));
    Object.keys(NOTES).forEach(id=>{ if(!DIRTY[id]) initNote(id, true) });
  }
  SAMPLE = OWNER ? await claude.use("sample") : null;
  if(PLANINDEX) render();
})();
</script>
